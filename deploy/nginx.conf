limit_req_zone $binary_remote_addr zone=public:10m rate=10r/s;
server {
    listen 80;
    server_name _;
    client_max_body_size 16m;
    server_tokens off;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    location /api/ {
        # API has per-session controls. Do not drop already accepted emergency jobs.
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_request_buffering on;
        add_header Cache-Control no-store always;
    }
    location / {
        limit_req zone=public burst=30 nodelay;
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }
}
