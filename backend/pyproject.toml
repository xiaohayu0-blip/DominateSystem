[project]
name = "dominate-system-backend"
version = "0.1.0"
requires-python = "==3.14.*"
dependencies = [
  "fastapi>=0.121,<1", "uvicorn>=0.38,<1", "sqlalchemy>=2.0.44,<3",
  "alembic>=1.17,<2", "psycopg[binary]>=3.2,<4", "pydantic-settings>=2.11,<3",
  "python-multipart>=0.0.20,<1", "httpx>=0.28,<1", "pypdf>=6,<7",
  "python-docx>=1.2,<2", "openpyxl>=3.1.5,<4", "pillow>=12,<13"
]

[dependency-groups]
dev = ["pytest>=9,<10", "ruff>=0.14,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py314"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
